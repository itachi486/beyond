name: Verify Cloudflare migration

on:
  push:
    branches:
      - feature/cloudflare-workers-d1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:server
      - run: npx --yes wrangler@4 deploy --dry-run
